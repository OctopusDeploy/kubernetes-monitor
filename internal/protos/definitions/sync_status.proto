syntax = "proto3";

option csharp_namespace = "Octopus.Observability.MessageContracts";
option go_package = "github.com/octopusdeploy/kubernetes-monitor/internal/protos";

message SyncStatus {
  // Superseded by sync_status_code_v2. Never reports SYNC_STATUS_CODE_ORPHANED.
  SyncStatusCode sync_status_code = 1 [deprecated = true];
  string message = 2;
  string json_patch = 3;
  SyncStatusCode sync_status_code_v2 = 4;
}

enum SyncStatusCode {
  SYNC_STATUS_CODE_UNSPECIFIED = 0;
  SYNC_STATUS_CODE_UNKNOWN = 1;
  SYNC_STATUS_CODE_NOTAPPLICABLE = 2;
  SYNC_STATUS_CODE_INSYNC = 3;
  SYNC_STATUS_CODE_OUTOFSYNC = 4;
  SYNC_STATUS_CODE_ORPHANED = 5;
}
