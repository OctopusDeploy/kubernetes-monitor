global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: 'otel-collector-app-metrics'
    static_configs:
      - targets: ['otel-collector:9090']

  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pyroscope'
    static_configs:
      - targets: ['pyroscope:4040']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
