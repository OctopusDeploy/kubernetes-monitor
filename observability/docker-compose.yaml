# Local development only. Services and the demo Grafana account are not production configuration.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
      - "127.0.0.1:5055:13133"  # Collector health check
      - "127.0.0.1:5056:8888"   # Collector internal metrics
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:5051:16686"  # Web UI
      - "127.0.0.1:5057:13133"  # Jaeger health check

  prometheus:
    image: prom/prometheus:v3.11.2
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:5052:9090"   # Prometheus UI + /-/ready
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  pyroscope:
    image: grafana/pyroscope:2.0.1
    restart: unless-stopped
    volumes:
      - pyroscope-data:/data
    ports:
      - "127.0.0.1:5053:4040"   # Pyroscope UI + /ready

  grafana:
    image: grafana/grafana-oss:13.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5054:3000"   # Grafana UI + /api/health
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_INSTALL_PLUGINS: "grafana-pyroscope-app"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
      pyroscope:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pyroscope-data:
  grafana-data:
