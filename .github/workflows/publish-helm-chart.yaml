name: Publish Helm chart
run-name: Publish Helm chart

# Run on PRs and releases
# We only push to production on a release
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - ".github/**"
      - "**.md"

  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Run Helm unit tests
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git
          helm unittest charts/kubernetes-monitor

  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: Generate docs
        working-directory: charts/kubernetes-monitor
        run: "npm run generate-docs"
      - name: Check readme is unchanged
        run: |
          echo "Ensuring readme is up-to-date"
          echo "If this test fails, run 'npm run generate-docs' locally and commit the changes"
          git diff --ignore-cr-at-eol -w --exit-code

  version_and_package:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      CHART_VERSION: ${{ steps.version.outputs.CHART_VERSION  }}
      PACKAGE_NAME: ${{ steps.version.outputs.PACKAGE_NAME }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.0"

      # Helm automatically sets the image version as a label, with a limit of 63 which is exceeded by pre-release builds
      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Parse Chart config
        uses: pietrobolcato/action-read-yaml@9f13718d61111b69f30ab4ac683e67a56d254e1d # 1.1.0
        id: read_chart_yaml
        with:
          config: ${{ github.workspace }}/charts/kubernetes-monitor/Chart.yaml

      - name: Generate application version
        if: github.event_name == 'pull_request'
        id: app_version
        run: |
          BRANCH_NAME=$(echo ${{ github.head_ref }} | tr '/' '-' | tr '_' '-')
          CURRENT_VERSION=$(git describe --tags --abbrev=0 || echo "0.0.0")
          VERSION="${CURRENT_VERSION}-${BRANCH_NAME}-${{ env.SHORT_SHA }}"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate chart version
        id: version
        shell: bash
        run: |
          chart_version="${{ steps.read_chart_yaml.outputs.version }}"

          pre_release=""
          if [[ "${{github.event_name}}" != "release" ]]
          then
              cleansed_branch=$(echo ${{ github.head_ref }} | tr '/' '-' | tr '_' '-')
              pre_release="-${cleansed_branch}-$(date +'%Y%m%d%H%M%S')"
          fi

          full_version="$chart_version$pre_release"

          echo "CHART_VERSION=$full_version" >> $GITHUB_OUTPUT
          echo "PACKAGE_NAME=kubernetes-monitor-chart-$full_version.tgz" >> $GITHUB_OUTPUT

      - name: Package Chart with Updated Application (Pre-release)
        if: github.event_name == 'pull_request'
        run: helm package './charts/kubernetes-monitor' --version '${{ steps.version.outputs.CHART_VERSION }}' --app-version '${{ steps.app_version.outputs.APP_VERSION }}'

      - name: Package Chart
        if: (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/kubernetes-monitor-chart'))
        run: helm package './charts/kubernetes-monitor' --version '${{ steps.version.outputs.CHART_VERSION }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload packaged chart
        with:
          name: "${{ steps.version.outputs.PACKAGE_NAME }}"
          path: "${{ github.workspace }}/kubernetes-monitor-chart-${{ steps.version.outputs.CHART_VERSION }}.tgz"

  publish_to_octopus:
    runs-on: ubuntu-latest
    # We publish to Artifactory if this is a pull request or is a release for the helm chart
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/kubernetes-monitor-chart')) }}
    needs: version_and_package
    permissions:
      id-token: write
    steps:
      - name: Download packaged chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "${{ needs.version_and_package.outputs.PACKAGE_NAME }}"

      - name: Login to Octopus
        uses: OctopusDeploy/login@d156cc2dd8d6f4592c3a0e54e8b51a4ea9198dd5 # v2.0.1
        with:
          server: ${{ vars.OCTOPUS_SERVER }}
          service_account_id: ${{ secrets.OCTOPUS_SERVICE_ACCOUNT }}

      - name: Push helm chart to Octopus Deploy 🐙
        uses: OctopusDeploy/push-package-action@e2b339863f2aba04d1aead9675136af1bd2bceaa # v4.0.5
        with:
          space: "${{ vars.DEPLOY_K8S_OWNERS_SPACE_NAME }}"
          packages: ${{ needs.version_and_package.outputs.PACKAGE_NAME }}
          overwrite_mode: IgnoreIfExists

      - name: Create a release in Octopus Deploy 🐙
        uses: OctopusDeploy/create-release-action@4eaeba13bef87ec399ecac936e9f513758784694 # v4.2.3
        with:
          space: "${{ vars.DEPLOY_K8S_OWNERS_SPACE_NAME }}"
          project: "Octopus Kubernetes Monitor"
          release_number: ${{ needs.version_and_package.outputs.CHART_VERSION }}
          package_version: ${{ needs.version_and_package.outputs.CHART_VERSION }}
          ignore_existing: true
