name: "Tests"
run-name: "Tests"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions: # https://github.com/dorny/test-reporter/issues/168
      statuses: write
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for significant changes
        id: changed-files-specific
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            charts/**
            .release-please-manifest.json
            release-please-config.json
            .github/**
            **.md

      - name: Set up Go
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # if we just run the unit tests then go doesn't compile the parts of the app that aren't covered by
      # unit tests; this forces it
      - name: Build binary
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        run: go build -o bin/kubernetes-monitor main.go

      # https://golangci-lint.run/
      - name: golangci-lint
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Setup gotestsum
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        run: go install gotest.tools/gotestsum@latest

      - name: Unit Tests
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        run: gotestsum --format testname --junitfile results/unit-tests.xml

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: (success() || failure()) && (github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true')
        with:
          name: Test Results
          path: "results/*-tests.xml"
          reporter: java-junit
