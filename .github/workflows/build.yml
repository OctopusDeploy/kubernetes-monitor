name: Build and Push Image
run-name: "Build and Push Image"

# Run on PRs and releases
# We only push to production on a release
on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

env:
  prerelease_registry: "docker.packages.octopushq.com"
  image_name: "octopusdeploy/kubernetes-monitor"

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'release' && !startsWith(github.ref, 'refs/tags/kubernetes-monitor-chart')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write # upload image CVE results to GitHub code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for significant changes
        id: changed-files-specific
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            charts/**
            .release-please-manifest.json
            release-please-config.json
            .github/**
            **.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

      # Helm automatically sets the image version as a label, with a limit of 63 which is exceeded by pre-release builds
      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Determine PR version
        if: github.event_name == 'pull_request'
        id: new_version
        run: |
          BRANCH_NAME=$(echo ${{ github.head_ref }} | tr '/' '-' | tr '_' '-')
          CURRENT_VERSION=$(git describe --tags --abbrev=0 || echo "0.0.0")
          VERSION="${CURRENT_VERSION}-${BRANCH_NAME}-${{ env.SHORT_SHA }}"
          echo "version=${VERSION}" >> "$GITHUB_ENV"

      - name: Generate application version
        if: github.event_name == 'release'
        id: release_version
        run: |
          echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"

      - name: Login to Artifactory
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: "docker.packages.octopushq.com"
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}


      - name: Build and push to artifactory
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: 6nsnwhw6t5
          push: true
          tags: "${{ env.prerelease_registry }}/${{ env.image_name }}:${{ env.version }}"
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.version }}

      # ---------------------------------------------------------------
      # Supply chain: SBOMs + image vulnerability scan
      # Runs whenever an image was built. Uploads to DependencyTrack on
      # releases only. The CVE scan runs before the Docker Hub push, so
      # a critical/high CVE with a fix available blocks the release.
      # ---------------------------------------------------------------

      - name: Set up Go
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate Go module SBOM (CycloneDX)
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            app -json -licenses -main . -output sbom-go.json

      - name: Scan image for vulnerabilities (Docker Scout)
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: "registry://${{ env.prerelease_registry }}/${{ env.image_name }}:${{ env.version }}"
          platform: linux/amd64
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          sarif-file: scout-cves.sarif
          summary: true
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          registry-user: ${{ secrets.ARTIFACTORY_USERNAME }}
          registry-password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Upload CVE results to GitHub code scanning
        if: always() && (github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true') && hashFiles('scout-cves.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scout-cves.sarif
          category: docker-scout-image

      - name: Generate container image SBOM (CycloneDX)
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: sbom
          image: "registry://${{ env.prerelease_registry }}/${{ env.image_name }}:${{ env.version }}"
          platform: linux/amd64
          format: cyclonedx
          output: sbom-image.json
          summary: false
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          registry-user: ${{ secrets.ARTIFACTORY_USERNAME }}
          registry-password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Upload SBOMs as build artifacts
        if: github.event_name == 'release' || steps.changed-files-specific.outputs.any_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.version }}
          path: |
            sbom-go.json
            sbom-image.json

      - name: Upload Go module SBOM to DependencyTrack
        if: github.event_name == 'release'
        uses: OctopusDeploy/upload-sbom-go@912d97f2031f2e6d7ea0fb1607d4ee59734d77d8 # v1.4.4
        with:
          dependency-track-url: ${{ secrets.DTRACK_URL }}
          dependency-track-key: ${{ secrets.DTRACK_KEY }}
          project-name: kubernetes-monitor-go
          project-version: ${{ env.version }}
          parent-name: kubernetes-monitor
          is-latest: true
          project-tags: kubernetes-monitor,modern-deployments,go
          sbom-file: sbom-go.json

      - name: Upload container image SBOM to DependencyTrack
        if: github.event_name == 'release'
        uses: OctopusDeploy/upload-sbom-go@912d97f2031f2e6d7ea0fb1607d4ee59734d77d8 # v1.4.4
        with:
          dependency-track-url: ${{ secrets.DTRACK_URL }}
          dependency-track-key: ${{ secrets.DTRACK_KEY }}
          project-name: kubernetes-monitor-image
          project-version: ${{ env.version }}
          parent-name: kubernetes-monitor
          is-latest: true
          project-tags: kubernetes-monitor,modern-deployments,container
          sbom-file: sbom-image.json

      # Only push to production if it's a release
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'release'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push image to Docker Hub
        if: github.event_name == 'release'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.image_name }}:${{ env.version }} \
            --tag ${{ env.image_name }}:latest \
            ${{ env.prerelease_registry }}/${{ env.image_name }}:${{ env.version }}

