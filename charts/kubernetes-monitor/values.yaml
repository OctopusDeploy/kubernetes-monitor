# Default values for kubernetes-monitor.
# -- Override for the short name for generated resources
nameOverride: ""
# -- Override for the fully qualified app name for generated resources
fullnameOverride: ""

# -- Optional array of imagePullSecrets containing private registry credentials
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

image:
  # -- Image name to use
  repository: octopusdeploy/kubernetes-monitor
  # -- Registry host to pull images from
  registry: docker.io
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag to use
  # @default -- `.Chart.AppVersion`
  tag: ""
  tagSuffix: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Auto-mount service account token or not
  automountServiceAccountToken: true
  # -- Default file mode for projected volume (only used when automountServiceAccountToken is false)
  # Uses octal notation. Default: 0444
  projectedVolumeDefaultMode: 0444
  # -- Custom service account name
  name: ""
  # -- Additional annotations for the service account
  annotations: {}

# -- Annotations to be added to kubernetes monitor pods
podAnnotations: {}
# -- Labels to be added to kubernetes monitor pods
podLabels: {}
# -- Security context for kubernetes monitor pods
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
# -- Security context for kubernetes monitor containers
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
# -- Custom node selector for kubernetes monitor pods.
nodeSelector:
  kubernetes.io/os: linux
# -- Custom tolerations for kubernetes monitor pods
tolerations: []
# -- Custom affinity for kubernetes monitor pods
affinity: {}

# -- Resources to allocate for the kubernetes monitor pod
resources:
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

monitor:
  # -- The gRPC url (including the port) of the Octopus Deploy server to communicate with
  # @section -- Monitor
  serverGrpcUrl: ""

  # -- The thumbprint of the Octopus Deploy server the monitor is communicating with.
  # This should only be used if you wish to pin the certificate.
  # @section -- Monitor
  serverThumbprint: ""

  # -- If setting up the agent without automatic registration, this is the installation id.
  # If you provide this, you must also provide the authentication token.
  # If you provide this, the monitor will not attempt to register with the server.
  # @section -- Monitor
  installationId: ""
  # -- If setting up the agent without automatic registration, this is the authentication token.
  # If you provide this, you must also provide the installation ID.
  # If you provide this, the monitor will not attempt to register with the server.
  # @section -- Monitor
  authenticationToken: ""
  # -- A base64 encoded string of the custom CA certificate to use to verify the Octopus Deploy server
  # @section -- Monitor
  customCaCertificate: ""

  # -- Enable debug mode on the monitor, including debug logging and continuous profiling.
  # Sets the DEBUG environment variable on the monitor pod.
  # @section -- Monitor
  debug: false

  # -- Enable verbose gRPC debug logging on the monitor pod. When true, sets the
  # GRPC_GO_LOG_SEVERITY_LEVEL, GRPC_GO_LOG_VERBOSITY_LEVEL and GODEBUG (http2debug)
  # environment variables to log gRPC communications and HTTP/2 frames.
  # WARNING: Raw gRPC request/response bodies maybe logged which could contain sensitive information
  # only use this debug logging when absolutely necessary
  # @section -- Monitor
  grpcDebugLogging: false

  # -- Largest gRPC message the monitor will send to Octopus Server, in bytes.
  # Sets the MAX_GRPC_SEND_MESSAGE_SIZE_BYTES environment variable on the monitor pod.
  # Leave empty to use the monitor's default of 50MiB.
  # @section -- Monitor
  maxGrpcSendMessageSizeBytes: ""

  # -- Largest gRPC message the monitor will accept from Octopus Server, in bytes.
  # Sets the MAX_GRPC_RECEIVE_MESSAGE_SIZE_BYTES environment variable on the monitor pod.
  # Leave empty to use the monitor's default of 20MiB.
  # @section -- Monitor
  maxGrpcReceiveMessageSizeBytes: ""

  healthCheck:
    # -- How often the monitor sends a gRPC health check to Octopus Server, as a duration
    # such as "30s" or "1m". Sets the HEALTH_CHECK_INTERVAL environment variable on the
    # monitor pod. Set to "0" to disable the health check, which should only be for
    # troubleshooting (error-recovery is limited when health checks are disabled).
    # Leave empty to use the monitor's default of 30 seconds.
    # @section -- Monitor
    interval: ""

    # -- How long Octopus Server may go unanswered before the monitor exits and the pod is
    # restarted, as a duration such as "5m" or "1h".
    # Sets the HEALTH_CHECK_GIVE_UP_AFTER environment variable on the monitor pod.
    # Leave empty to use the monitor's default of 5 minutes.
    # @section -- Monitor
    giveUpAfter: ""

  # -- Send gRPC messages to Octopus Server uncompressed.
  # When true, sets the DISABLE_GRPC_COMPRESSION environment variable on the monitor pod.
  # Only use this for troubleshooting.
  # @section -- Monitor
  disableGrpcCompression: false

  # -- Include cluster-scoped resources (Nodes, Namespaces, PVs, etc.) in monitoring.
  # Only effective when global.targetNamespaces is set. When false (default), the monitor
  # only watches namespace-scoped resources. When true, the chart auto-creates a
  # ClusterRole and ClusterRoleBinding granting read access to all resources,
  # replacing the per-namespace Roles.
  # @section -- Monitor
  clusterScopedResources: false

  # -- RBAC rules granted to the monitor's Role/ClusterRole. Verbs are always
  # get/watch/list and cannot be overridden; only apiGroups and resources are
  # configurable.
  # @section -- Monitor
  rules:
    - apiGroups:
        - '*'
      resources:
        - '*'

  # -- Additional pod spec to apply to the monitor pod - does not override any other configuration
  # @section -- Monitor
  spec: {}
  containers:
    monitor:
      # -- Additional container spec to apply to the monitor container - does not override any other configuration
      # @section -- Monitor
      spec: {}
      # -- Additional env to apply to the monitor container - does not override any other configuration
      # @section -- Monitor
      env: []

registration:
  # -- Automatically register the monitor with the Octopus Deploy server
  # @section -- Registration
  register: true
  # -- The type of configuration store to use when saving configuration
  # -- Can be "kubernetes" or "file"
  # @section -- Registration
  configurationStoreType: "kubernetes"
  # -- The API URL of Octopus Deploy for registration
  # @section -- Registration
  serverApiUrl: ""
  # -- The access token to authenticate to Octopus Deploy to register with. Can be a bearer token or an API token.
  # @section -- Registration
  serverAccessToken: ""
  # -- The name of an existing secret containing the server access token. If specified, the registration secret will not be created.
  # @section -- Registration
  serverAccessTokenSecretName: ""
  # -- The key in the existing secret that contains the server access token. Defaults to SERVER_ACCESS_TOKEN.
  # @section -- Registration
  serverAccessTokenSecretKey: "SERVER_ACCESS_TOKEN"
  # -- The machine name of the agent this monitor is responsible for
  # @section -- Registration
  machineName: ""
  # -- The space id that the monitor is registering with
  # @section -- Registration
  spaceId: ""
  # -- The base64-encoded public key of the self-signed x509 certificate or root CA certificate used by the target Octopus Server. Must be in the PEM/CER format.
  # @section -- Registration
  serverCertificate: ""
  # -- The name of a secret containing the base64-encoded public key of the self-signed x509 certificate or root CA certificate used by the target Octopus Server. Must be in the PEM/CER format. Value must be set in `data.octopus-server-certificate.pem` in secret.
  # @section -- Registration
  serverCertificateSecretName: ""
  serviceAccount:
    # -- Specifies whether a service account should be created for the registration hook
    # @section -- Registration
    create: true
    # -- Auto-mount service account token
    # @section -- Registration
    automountServiceAccountToken: true
    # -- Default file mode for projected volume (only used when automountServiceAccountToken is false)
    # Uses octal notation. Default: 0444
    # @section -- Registration
    projectedVolumeDefaultMode: 0444
    # -- Custom service account name
    # @section -- Registration
    name: ""
    # -- Additional annotations for the service account
    # @section -- Registration
    annotations: {}

  # -- Additional pod spec to apply to the registration pod - does not override any other configuration
  # @section -- Registration
  spec: {}
  containers:
    registration:
      # -- Additional container spec to apply to the registration container - does not override any other configuration
      # @section -- Registration
      spec: {}
      # -- Additional env to apply to the registration container - does not override any other configuration
      # @section -- Registration
      env: []

global:
  # -- The API URL of Octopus Deploy for registration
  # -- This is overridden by registration.serverApiUrl if both are set
  # @section -- Globals
  serverApiUrl: ""
  # -- The base64-encoded public key of the self-signed x509 certificate or root CA certificate used by the target Octopus Server. Must be in the PEM/CER format.
  # -- This is overridden by registration.serverCertificate if both are set
  # @section -- Globals
  serverCertificate: ""
  # -- The name of a secret containing the base64-encoded public key of the self-signed x509 certificate or root CA certificate used by the target Octopus Server. Must be in the PEM/CER format. Value must be set in `data.octopus-server-certificate.pem` in secret.
  # -- This is overridden by registration.serverCertificateSecretName if both are set
  # @section -- Globals
  serverCertificateSecretName: ""
  # -- A list of namespaces that the monitor should monitor. If empty, all namespaces are monitored.
  # @section -- Globals
  targetNamespaces: []
