suite: Test Secret
templates:
  - monitor-authentication-secret.yaml
tests:
  - it: "should add secret when manually registered"
    set:
      monitor:
        installationId: "installation-id"
        authenticationToken: "authentication-token"
      registration:
        register: false
    asserts:
      - equal:
          path: data.INSTALLATION_ID
          # echo -n "installation-id" | base64
          value: "aW5zdGFsbGF0aW9uLWlk"
      - equal:
          path: data.AUTHENTICATION_TOKEN
          # echo -n "authentication-token" | base64
          value: "YXV0aGVudGljYXRpb24tdG9rZW4="

  - it: "should not generate secret when manually registered"
    set:
      registration:
        register: true
    asserts:
      - notExists:
          path: ""

  - it: "Should fail when not registering and missing installationId"
    set:
      monitor:
        authenticationToken: "authentication-token"
      registration:
        register: false
    asserts:
      - failedTemplate:
          errorMessage: "When installing without automatically registering, .Values.monitor.installationId must be specified"

  - it: "Should fail when not registering and missing authentication token"
    set:
      monitor:
        installationId: "installation-id"
      registration:
        register: false
    asserts:
      - failedTemplate:
          errorMessage: "When installing without automatically registering, .Values.monitor.authenticationToken must be specified"

  - it: "Should fail when not registering and missing both installationId and authentication token"
    set:
      registration:
        register: false
    asserts:
      - failedTemplate: {}

