suite: Test Registration Pod Secret References
templates:
  - registration-pod.yaml
tests:
  - it: "should use generated secret by default"
    values:
      - values/automatic_registration_base_values.yaml
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: spec.containers[0].env[?(@.name=='SERVER_ACCESS_TOKEN')].valueFrom.secretKeyRef.name
          value: "release-name-kubernetes-monitor-chart-registration"
      - equal:
          path: spec.containers[0].env[?(@.name=='SERVER_ACCESS_TOKEN')].valueFrom.secretKeyRef.key
          value: "SERVER_ACCESS_TOKEN"

  - it: "should use existing secret when serverAccessTokenSecretName is provided"
    values:
      - values/automatic_registration_base_values.yaml
    set:
      registration:
        serverAccessTokenSecretName: "my-custom-secret"
    asserts:
      - equal:
          path: spec.containers[0].env[?(@.name=='SERVER_ACCESS_TOKEN')].valueFrom.secretKeyRef.name
          value: "my-custom-secret"
      - equal:
          path: spec.containers[0].env[?(@.name=='SERVER_ACCESS_TOKEN')].valueFrom.secretKeyRef.key
          value: "SERVER_ACCESS_TOKEN"

  - it: "should use custom secret key when serverAccessTokenSecretKey is provided"
    values:
      - values/automatic_registration_base_values.yaml
    set:
      registration:
        serverAccessTokenSecretName: "my-custom-secret"
        serverAccessTokenSecretKey: "MY_CUSTOM_KEY"
    asserts:
      - equal:
          path: spec.containers[0].env[?(@.name=='SERVER_ACCESS_TOKEN')].valueFrom.secretKeyRef.name
          value: "my-custom-secret"
      - equal:
          path: spec.containers[0].env[?(@.name=='SERVER_ACCESS_TOKEN')].valueFrom.secretKeyRef.key
          value: "MY_CUSTOM_KEY"

  - it: "should not create pod when registration is disabled"
    set:
      registration:
        register: false
    asserts:
      - hasDocuments:
          count: 0
