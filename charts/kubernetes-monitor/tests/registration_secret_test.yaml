suite: Test Registration Secret
templates:
  - registration-secret.yaml
tests:
  - it: "should create secret with serverAccessToken when registering"
    values:
      - values/automatic_registration_base_values.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "release-name-kubernetes-monitor-chart-registration"
      - equal:
          path: data.SERVER_ACCESS_TOKEN
          # echo -n "access-token-here" | base64
          value: "YWNjZXNzLXRva2VuLWhlcmU="

  - it: "should not create secret when using existing secret"
    values:
      - values/automatic_registration_base_values.yaml
    set:
      registration:
        serverAccessToken: ""
        serverAccessTokenSecretName: "my-existing-secret"
    asserts:
      - hasDocuments:
          count: 0

  - it: "should not create secret when registration is disabled"
    set:
      registration:
        register: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "should fail when registering without serverAccessToken and no existing secret"
    values:
      - values/automatic_registration_base_values.yaml
    set:
      registration:
        serverAccessToken: ""
    asserts:
      - failedTemplate:
          errorMessage: "When registering the monitor automatically, registration.serverAccessToken must be provided."
