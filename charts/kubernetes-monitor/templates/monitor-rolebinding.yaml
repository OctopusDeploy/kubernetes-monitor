{{- if and .Values.serviceAccount.create (and (not (empty .Values.global.targetNamespaces)) (not .Values.monitor.clusterScopedResources)) -}}
{{- $root := . -}}
{{- range .Values.global.targetNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name:  {{ include "kubernetes-monitor.kubernetesMonitorRoleBindingName" $root }}
  namespace: {{ . | quote }}
  labels:
    {{- include "kubernetes-monitor.labels" $root | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "kubernetes-monitor.serviceAccountName" $root }}
  namespace: {{ $root.Release.Namespace | quote }}
roleRef:
  kind: Role
  name: {{ include "kubernetes-monitor.kubernetesMonitorRoleName" $root }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}